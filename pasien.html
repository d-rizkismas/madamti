<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hubungi Madam Ti'</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-dark: #0f0518; 
            --primary: #9d00ff; 
            --accent: #ff007f; 
            --bubble-in: #2d1b4e; 
            --bubble-out: #ff007f; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Lato', sans-serif; margin: 0; background: radial-gradient(circle at center, #2e004f 0%, #000000 100%); height: 100vh; display: flex; flex-direction: column; color: #e0e0e0; }
        h1, h2 { font-family: 'Cinzel', serif; }
        
        .header { background: linear-gradient(135deg, #4b0082, #000); color: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--accent); }
        .card { background: rgba(26, 11, 46, 0.9); margin: 20px; padding: 25px; border-radius: 15px; box-shadow: 0 0 20px rgba(157, 0, 255, 0.2); border: 1px solid rgba(157, 0, 255, 0.3); }
        input { width: 100%; padding: 15px; border: 1px solid #4b0082; border-radius: 12px; font-size: 16px; margin: 10px 0; background: #0f0518; color: white; }
        input:focus { border-color: var(--accent); outline: none; }
        input::placeholder { color: #666; }
        
        label { display: block; margin-top: 15px; color: var(--primary); font-size: 0.9em; margin-bottom: 5px; font-family: 'Cinzel', serif; }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin: 5px 0; font-family: 'Lato'; }
        .btn-connect { background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .btn-send { background: var(--accent); color: white; width: 60px; height: 50px; border-radius: 25px; box-shadow: 0 0 10px var(--accent); }
        .btn-camera { background: #2d1b4e; color: var(--text-main); width: 50px; height: 50px; border-radius: 25px; font-size: 1.3em; border: 1px solid rgba(255,255,255,0.1); }
        
        #chat-area { display: none; flex: 1; flex-direction: column; height: 100%; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 0.95em; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .msg-in { background: var(--bubble-in); color: white; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(157, 0, 255, 0.2); }
        .msg-out { background: linear-gradient(135deg, var(--accent), #9d00ff); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-row { display: flex; gap: 10px; padding: 15px; background: rgba(26, 11, 46, 0.9); border-top: 1px solid rgba(157, 0, 255, 0.3); align-items: center; backdrop-filter: blur(5px); }
        .input-row input { flex: 1; margin: 0; }
        
        .file-attachment { background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; margin-top: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .file-attachment img { max-width: 100%; display: block; }
        .file-info { padding: 8px; background: rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px; }
        .download-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.85em; }
        
        #file-input, #camera-input { display: none; }
        .status { text-align: center; padding: 10px; color: var(--primary); font-size: 0.9em; font-family: 'Cinzel'; }
        
        .action-buttons { padding: 10px 20px; display: flex; gap: 10px; background: #0f0518; }
        .action-buttons button { flex: 1; margin: 0; }
        .btn-call { background: #2d1b4e; color: var(--accent); border: 1px solid var(--accent); }
        .btn-end { background: #500000; color: #ff4444; border: 1px solid #ff4444; display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0; text-shadow: 0 0 10px var(--primary);">🔮 Konsultasi Madam Ti'</h2>
    </div>

    <div id="login-card" class="card">
        <p style="margin-top:0; color:#aaa; text-align: center;">Silakan isi data spiritual Anda:</p>
        
        <label for="patientName">✦ Nama Anda</label>
        <input type="text" id="patientName" placeholder="Contoh: Sari Dewi">
        
        <label for="adminId">✦ ID Spiritual Madam Ti'</label>
        <input type="text" id="adminId" placeholder="Contoh: MadamTi-1234">
        
        <button class="btn-connect" onclick="connect()">Hubungkan Energi</button>
        <div id="status" class="status">Menunggu koneksi spiritual...</div>
    </div>

    <div id="chat-area">
        <div id="chat-box"></div>
        <div class="input-row">
            <label for="camera-input" class="btn-camera">📷</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)">
            
            <label for="file-input" class="btn-camera" style="font-size:1em;">📜</label>
            <input type="file" id="file-input" accept="image/*,.pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
            
            <input type="text" id="msgInput" placeholder="Ketik pesan...">
            <button class="btn-send" onclick="sendMsg()">➤</button>
        </div>
        <div class="action-buttons">
            <button class="btn-call" onclick="callAdmin()">📞 Telepon Madam</button>
            <button class="btn-end" id="btn-end-call" onclick="endCall()">❌ Tutup</button>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        let peer = new Peer();
        let conn = null;
        let call = null;
        let localStream = null;
        const MAX_FILE_SIZE = 500 * 1024;

        function connect() {
            const adminId = document.getElementById('adminId').value.trim();
            const patientName = document.getElementById('patientName').value.trim();
            
            if(!adminId) return alert("Masukkan ID Spiritual Madam Ti'!");
            if(!patientName) return alert("Masukkan nama Anda terlebih dahulu!");
            
            conn = peer.connect(adminId);
            
            conn.on('open', () => {
                // Kirim nama pasien ke Madam Ti'
                conn.send({ 
                    type: 'patientInfo', 
                    name: patientName 
                });
                
                document.getElementById('status').innerText = "✅ Terhubung dengan Madam Ti'!";
                document.getElementById('status').style.color = "var(--accent)";
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('chat-area').style.display = 'flex';
            });

            conn.on('data', (data) => {
                const box = document.getElementById('chat-box');
                if (data.type === 'file') addFileToBox(data, 'in');
                else box.innerHTML += `<div class="msg msg-in"><b>Madam Ti':</b> ${data.text}</div>`;
                box.scrollTop = box.scrollHeight;
                if(navigator.vibrate) navigator.vibrate(100);
            });
            
            conn.on('error', (err) => {
                alert("Gagal terhubung. Pastikan ID Spiritual benar!");
            });
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(conn && input.value.trim()) {
                conn.send({ type: 'text', text: input.value });
                document.getElementById('chat-box').innerHTML += `<div class="msg msg-out">${input.value}</div>`;
                input.value = '';
                document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > MAX_FILE_SIZE) {
                alert(`Berkas terlalu besar! Maksimal 500KB`);
                event.target.value = '';
                return;
            }

            const status = document.createElement('div');
            status.className = 'status';
            status.innerText = '⏳ Mengirim...';
            document.getElementById('chat-box').appendChild(status);

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = { type: 'file', name: file.name, size: file.size, fileType: file.type, data: e.target.result };
                if(conn) {
                    conn.send(fileData);
                    addFileToBox(fileData, 'out');
                }
                status.remove();
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        function addFileToBox(fileData, type) {
            const box = document.getElementById('chat-box');
            const isImage = fileData.fileType.startsWith('image/');
            let content = `<div class="msg msg-${type}">`;
            if (isImage) {
                content += `<div class="file-attachment"><img src="${fileData.data}"></div>`;
            } else {
                content += `
                    <div class="file-attachment">
                        <div class="file-info">
                            <span>📜</span>
                            <div style="flex:1">
                                <div style="font-weight:600; font-size:0.85em">${fileData.name}</div>
                                <a href="${fileData.data}" download="${fileData.name}" class="download-link">⬇ Simpan</a>
                            </div>
                        </div>
                    </div>
                `;
            }
            content += `</div>`;
            box.innerHTML += content;
            box.scrollTop = box.scrollHeight;
        }

        function callAdmin() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                localStream = stream;
                const adminId = document.getElementById('adminId').value;
                call = peer.call(adminId, stream);
                document.getElementById('btn-end-call').style.display = 'block';
                document.querySelector('.btn-call').style.display = 'none';
                
                call.on('stream', (remoteStream) => {
                    document.getElementById('remoteAudio').srcObject = remoteStream;
                    document.getElementById('remoteAudio').play();
                });
            });
        }

        function endCall() {
            if(call) call.close();
            if(localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('btn-end-call').style.display = 'none';
            document.querySelector('.btn-call').style.display = 'block';
        }
    </script>
</body>
</html>
